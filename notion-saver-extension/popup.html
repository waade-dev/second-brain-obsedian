<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Save to Notion</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="concepts.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.08v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V6.354c0-.606-.233-.933-.748-.887l-15.177.887c-.56.047-.747.327-.747.933zm14.337.745c.093.42 0 .84-.42.888l-.7.14v10.264c-.608.327-1.168.514-1.635.514-.748 0-.935-.234-1.495-.933l-4.577-7.186v6.952l1.448.327s0 .84-1.168.84l-3.222.186c-.093-.187 0-.653.327-.746l.84-.233V9.854L7.822 9.76c-.094-.42.14-1.026.793-1.073l3.456-.233 4.764 7.186v-6.44l-1.215-.139c-.093-.514.28-.887.747-.933zM1.936 1.035l13.31-.98c1.634-.14 2.055-.047 3.082.7l4.249 2.986c.7.513.934.653.934 1.213v16.378c0 1.026-.373 1.634-1.68 1.726l-15.458.934c-.98.047-1.448-.093-1.962-.747l-3.129-4.06c-.56-.747-.793-1.306-.793-1.96V2.667c0-.839.374-1.54 1.216-1.632z"></path>
      </svg>
      <span class="brand-name">Save to Notion</span>
    </div>
    <div class="header-actions"><button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" type="button">☾</button><button class="icon-btn" id="settings-link" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button></div>
  </header>

  <main>
    <!-- Empty / not-configured state -->
    <section id="not-configured" class="empty hidden">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="8" y1="7" x2="8" y2="17"></line>
          <line x1="8" y1="7" x2="16" y2="17"></line>
          <line x1="16" y1="7" x2="16" y2="17"></line>
        </svg>
      </div>
      <h2>Connect Notion</h2>
      <p>Add your integration token and database ID once, then save any page in a click.</p>
      <button id="open-options-link" class="btn primary">Open settings</button>
    </section>

    <!-- Save form -->
    <section id="form">
      <div id="db-bar" class="db-bar" role="tablist" aria-label="Choose database"></div>

      <div class="page-card">
        <img id="favicon" class="favicon" alt="" />
        <div class="page-meta">
          <div id="page-title" class="page-title">—</div>
          <div id="page-domain" class="page-domain">—</div>
        </div>
      </div>

      <div id="concept-fields" class="concept-fields hidden">
        <div class="field"><label for="concept">Concept book</label><select id="concept"><option value="">Choose a book…</option></select></div>
        <div class="field"><label for="subconcept">Subconcept / chapter</label><input id="subconcept" type="text" list="chapter-options" placeholder="Choose or name a chapter" autocomplete="off" /><datalist id="chapter-options"></datalist><p class="field-help">Choose an existing chapter or write a new one.</p></div>
      </div>
      <div id="schema-info" class="schema-info" role="status"></div>

      <div class="field">
        <label for="note">Note</label>
        <textarea id="note" rows="3" placeholder="Add a thought… (optional)"></textarea>
      </div>

      <div class="field">
        <label for="tags-input">Tags</label>
        <div class="tags-box" id="tags-box">
          <span id="chips" class="chips"></span>
          <input id="tags-input" type="text" placeholder="Add tags…" autocomplete="off" />
        </div>
      </div>

      <button id="save-btn" class="btn primary save">
        <span class="btn-content">
          <svg class="ic-save" viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
            <path d="M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.08v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V6.354c0-.606-.233-.933-.748-.887l-15.177.887c-.56.047-.747.327-.747.933zm14.337.745c.093.42 0 .84-.42.888l-.7.14v10.264c-.608.327-1.168.514-1.635.514-.748 0-.935-.234-1.495-.933l-4.577-7.186v6.952l1.448.327s0 .84-1.168.84l-3.222.186c-.093-.187 0-.653.327-.746l.84-.233V9.854L7.822 9.76c-.094-.42.14-1.026.793-1.073l3.456-.233 4.764 7.186v-6.44l-1.215-.139c-.093-.514.28-.887.747-.933zM1.936 1.035l13.31-.98c1.634-.14 2.055-.047 3.082.7l4.249 2.986c.7.513.934.653.934 1.213v16.378c0 1.026-.373 1.634-1.68 1.726l-15.458.934c-.98.047-1.448-.093-1.962-.747l-3.129-4.06c-.56-.747-.793-1.306-.793-1.96V2.667c0-.839.374-1.54 1.216-1.632z"></path>
          </svg>
          <span class="btn-label">Save to Notion</span>
        </span>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="ic-check" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>

      <div id="status" class="status" role="status"></div>
      <div class="hint"><kbd>⌘</kbd><span>/</span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to save</div>
    </section>
  </main>

  <script src="notion.js"></script>
  <script src="popup.js"></script>
</body>
</html>

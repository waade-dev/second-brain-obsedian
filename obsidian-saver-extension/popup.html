<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="icons/icon32.png" alt="" />
      <span class="brand-name">Save to Obsidian</span>
    </div>
    <button class="icon-btn" id="settings-link" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main>
    <!-- Empty / not-configured state -->
    <section id="not-configured" class="empty hidden">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>
      <h2>Choose your vault</h2>
      <p>Pick your Obsidian vault folder once, then save any page in a click.</p>
      <button id="open-options-link" class="btn primary">Open settings</button>
    </section>

    <!-- Save form -->
    <section id="form">
      <div class="page-card">
        <img id="favicon" class="favicon" alt="" />
        <div class="page-meta">
          <div id="page-title" class="page-title">—</div>
          <div id="page-domain" class="page-domain">—</div>
        </div>
      </div>

      <div class="field">
        <label for="note">Note</label>
        <textarea id="note" rows="3" placeholder="Add a thought… (optional)"></textarea>
      </div>

      <div class="field">
        <label for="tags-input">Tags</label>
        <div class="tags-box" id="tags-box">
          <span id="chips" class="chips"></span>
          <input id="tags-input" type="text" placeholder="Add tags…" autocomplete="off" />
        </div>
      </div>

      <button id="save-btn" class="btn primary save">
        <span class="btn-content">
          <svg class="ic-save" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span class="btn-label">Save to Obsidian</span>
        </span>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="ic-check" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>

      <div id="status" class="status" role="status"></div>
      <div class="hint"><kbd>⌘</kbd><span>/</span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to save</div>
    </section>
  </main>

  <script src="fs.js"></script>
  <script src="popup.js"></script>
</body>
</html>

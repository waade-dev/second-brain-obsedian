name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test the Notion Library
        run: npm --prefix notion-library test
      - name: Test Notion saver
        run: node --test notion-saver-extension/tests/*.test.cjs
      - name: Validate extension manifests
        run: node -e 'const fs = require("node:fs"); for (const dir of ["notion-saver-extension","obsidian-saver-extension"]) JSON.parse(fs.readFileSync(dir+"/manifest.json","utf8"))'
